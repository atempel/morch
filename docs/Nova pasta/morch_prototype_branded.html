<style>
#morch-app{font-family:'Noto Sans',sans-serif;font-size:13px;border-radius:10px;border:0.5px solid var(--m-border-strong);min-width:600px;min-height:480px;display:flex;flex-direction:column}
#morch-app[data-theme="dark"]{--m-bg:#12141A;--m-surface:#1C1F27;--m-surface-raised:#252A34;--m-border:#2F3542;--m-border-strong:#404859;--m-text:#ECEDF1;--m-text-2:#D8DEE9;--m-muted:#828EA6;--m-primary:#88C0D0;--m-primary-hover:#9FD0DE;--m-secondary:#81A1C1;--m-success:#A3BE8C;--m-warning:#EBCB8B;--m-danger:#BF616A;--m-on-primary:#12141A}
#morch-app[data-theme="light"]{--m-bg:#ECEDF1;--m-surface:#E5E9F0;--m-surface-raised:#D8DEE9;--m-border:#D8DEE9;--m-border-strong:#4C566A;--m-text:#363A46;--m-text-2:#3B4252;--m-muted:#4C566A;--m-primary:#5E81AC;--m-primary-hover:#48678C;--m-secondary:#81A1C1;--m-success:#A3BE8C;--m-warning:#EBCB8B;--m-danger:#BF616A;--m-on-primary:#ECEDF1}
#morch-app *{box-sizing:border-box}
.m-mono{font-family:'Noto Sans Mono',monospace}
.m-btn{background:var(--m-surface);color:var(--m-text);border:0.5px solid var(--m-border-strong);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Noto Sans',sans-serif}
.m-btn:hover{background:var(--m-surface-raised)}
.m-btn.active{background:var(--m-surface-raised);color:var(--m-text)}
.m-icon-btn{background:none;border:none;color:var(--m-muted);cursor:pointer;padding:2px;display:flex;font-size:15px}
.m-icon-btn:hover{color:var(--m-text)}
.m-toggle{width:32px;height:18px;border-radius:999px;position:relative;cursor:pointer;flex-shrink:0;border:none}
.m-toggle .knob{position:absolute;top:2px;width:14px;height:14px;border-radius:50%;background:var(--m-bg);transition:left .15s}
.m-row{background:var(--m-surface);border:0.5px solid var(--m-border);border-radius:6px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.m-badge{background:var(--m-bg);border-radius:999px;padding:1px 8px;font-size:10px}
.m-scrollcap{max-height:150px;overflow-y:auto}
.m-logo-lockup{height:26px;display:flex;align-items:center;flex-shrink:0}
.m-logo-lockup img{height:100%;width:auto;display:block}
#morch-app[data-theme="dark"] .m-logo-light{display:none}
#morch-app[data-theme="light"] .m-logo-dark{display:none}
#m-body{flex:1;min-height:320px;padding:12px 14px}
</style>

<script>
(function(){

var theme="dark", view="list", search="", activeFile="claude", archOpen=false, ignOpen=false;
var app=document.getElementById("morch-app");
function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function findFile(id){for(var i=0;i<files.length;i++){if(files[i].id===id)return files[i];}return null;}
function toggleInstr(id){files.forEach(function(f){f.instrs.forEach(function(i){if(i.id===id)i.on=!i.on;});});render();}
function ignoreFile(id){var f=findFile(id);if(f){f.ignored=!f.ignored;}if(activeFile===id){var v=files.filter(function(x){return !x.ignored;})[0];activeFile=v?v.id:null;}render();}
function manageAnyway(id){var f=findFile(id);if(f)f.manageAnyway=true;render();}
function rowHtml(i){
  var matches=!search||i.text.toLowerCase().indexOf(search)>-1||i.alias.toLowerCase().indexOf(search)>-1;
  if(!matches)return "";
  var onColor=i.on?"var(--m-text)":"var(--m-muted)";
  var deco=i.on?"none":"line-through";
  var trackColor=i.on?"var(--m-success)":"var(--m-border-strong)";
  var knobLeft=i.on?"16px":"2px";
  return "<div class=\"m-row\">"+
    "<button class=\"m-toggle\" data-act=\"toggle\" data-id=\""+i.id+"\" style=\"background:"+trackColor+"\" aria-label=\"Toggle instruction\"><span class=\"knob\" style=\"left:"+knobLeft+"\"></span></button>"+
    "<div style=\"flex:1;min-width:0\">"+
      "<div style=\"color:"+onColor+";text-decoration:"+deco+"\">"+esc(i.text)+"</div>"+
      "<div style=\"margin-top:4px;display:flex;gap:6px\">"+
        "<span class=\"m-badge m-mono\" style=\"color:var(--m-primary)\">"+i.alias+"</span>"+
        "<span class=\"m-mono\" style=\"color:var(--m-muted);font-size:10px;padding-top:2px\">"+i.line+"</span>"+
      "</div>"+
    "</div></div>";
}
function fileInstrList(f){
  if(f.flagged&&!f.manageAnyway){
    return "<div style=\"background:var(--m-surface);border:0.5px solid var(--m-border);border-radius:6px;padding:12px;display:flex;gap:10px;align-items:flex-start\">"+

  }
  var html=f.instrs.map(rowHtml).join("");

}

  var ignoredHtml="<div style=\"margin-top:8px;border:0.5px solid var(--m-border);border-radius:6px;background:var(--m-surface)\">"+
    "<div style=\"padding:8px 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer\" data-act=\"ign\">"+
      "<span style=\"display:flex;align-items:center;gap:6px\"><i class=\"ti ti-eye-off\" style=\"font-size:14px;color:var(--m-muted)\" aria-hidden=\"true\"></i>Ignored files <span class=\"m-mono\" style=\"color:var(--m-muted);font-size:10px\">("+ignoredList.length+")</span></span>"+
      "<i class=\"ti ti-chevron-"+(ignOpen?"up":"down")+"\" style=\"color:var(--m-muted)\" aria-hidden=\"true\"></i></div>"+
    (ignOpen?"<div class=\"m-scrollcap\" style=\"padding:0 10px 8px\">"+(ignoredList.length?ignoredList.map(function(f){return "<div style=\"padding:4px 0;border-top:0.5px solid var(--m-border);display:flex;justify-content:space-between;align-items:center\"><span class=\"m-mono\" style=\"color:var(--m-muted);font-size:11px\">"+f.name+" - hidden from dashboard, file untouched</span><button class=\"m-btn\" style=\"padding:2px 8px;font-size:10px\" data-act=\"restore\" data-id=\""+f.id+"\">Restore</button></div>";}).join(""):"<div class=\"m-mono\" style=\"color:var(--m-muted);font-size:11px;padding:6px 0\">No ignored files</div>")+"</div>":"")+
  "</div>";

  if(view==="list"){
    var active=null;
    for(var vi=0;vi<visible.length;vi++){if(visible[vi].id===activeFile)active=visible[vi];}
    if(!active&&visible.length)active=visible[0];
    body.innerHTML="<div style=\"display:flex;gap:14px\">"+
      "<div style=\"width:170px;flex-shrink:0\">"+
        visible.map(function(f){
          var onCount=f.instrs.filter(function(i){return i.on;}).length;
          var bg=f.id===activeFile?"var(--m-surface-raised)":"transparent";
          var nameColor=f.flagged?"var(--m-warning)":"var(--m-text)";
          return "<div style=\"display:flex;align-items:center;justify-content:space-between;padding:7px 8px;border-radius:6px;margin-bottom:2px;cursor:pointer;background:"+bg+"\" data-act=\"select\" data-id=\""+f.id+"\">"+
            "<span class=\"m-mono\" style=\"flex:1;color:"+nameColor+";font-size:12px\">"+f.name+"</span>"+
            "<span class=\"m-mono\" style=\"color:var(--m-muted);font-size:10px;margin-right:4px\">"+onCount+"/"+f.instrs.length+"</span>"+
            "<button class=\"m-icon-btn\" data-act=\"ignore\" data-id=\""+f.id+"\" aria-label=\"Ignore file\"><i class=\"ti ti-eye-off\" style=\"font-size:13px\" aria-hidden=\"true\"></i></button>"+
          "</div>";
        }).join("")+
        "<button class=\"m-btn\" style=\"width:100%;margin-top:6px\"><i class=\"ti ti-plus\" style=\"font-size:12px;vertical-align:-1px\" aria-hidden=\"true\"></i> Add file</button>"+
        archiveHtml+ignoredHtml+
      "</div>"+
      "<div style=\"flex:1;min-width:0\">"+(active?fileInstrList(active):"<div class=\"m-mono\" style=\"color:var(--m-muted)\">No files</div>")+"</div>"+
    "</div>";
  } else {
    body.innerHTML="<div style=\"display:flex;gap:10px;overflow-x:auto;padding-bottom:6px\">"+
      visible.map(function(f){
        var onCount=f.instrs.filter(function(i){return i.on;}).length;
        var nameColor=f.flagged?"var(--m-warning)":"var(--m-text)";
        return "<div style=\"background:var(--m-surface);border-radius:10px;padding:10px;width:230px;flex-shrink:0;max-height:320px;display:flex;flex-direction:column\">"+
          "<div style=\"background:var(--m-surface-raised);border-radius:6px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">"+
            "<span class=\"m-mono\" style=\"color:"+nameColor+";font-size:12px\">"+f.name+"</span>"+
            "<span style=\"display:flex;align-items:center;gap:6px\"><span class=\"m-mono\" style=\"color:var(--m-muted);font-size:10px\">"+onCount+"/"+f.instrs.length+"</span><button class=\"m-icon-btn\" data-act=\"ignore\" data-id=\""+f.id+"\" aria-label=\"Ignore file\"><i class=\"ti ti-eye-off\" style=\"font-size:12px\" aria-hidden=\"true\"></i></button></span>"+
          "</div>"+
          "<div style=\"overflow-y:auto;flex:1\">"+fileInstrList(f)+"</div>"+
        "</div>";
      }).join("")+
      "<div style=\"width:120px;flex-shrink:0;display:flex;align-items:flex-start;padding-top:10px\"><button class=\"m-btn\"><i class=\"ti ti-plus\" style=\"font-size:12px;vertical-align:-1px\" aria-hidden=\"true\"></i> Add column</button></div>"+
    "</div>"+archiveHtml+ignoredHtml;
  }
}
app.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el)return;
  var act=el.getAttribute("data-act");
  var id=el.getAttribute("data-id");
  if(act==="toggle")toggleInstr(parseInt(id,10));
  else if(act==="manage")manageAnyway(id);
  else if(act==="select")activeFile=id;
  else if(act==="ignore")ignoreFile(id);
  else if(act==="restore")ignoreFile(id);
  else if(act==="arch")archOpen=!archOpen;
  else if(act==="ign")ignOpen=!ignOpen;
  render();
});
document.getElementById("m-theme-toggle").onclick=function(){theme=theme==="dark"?"light":"dark";render();};
document.getElementById("m-view-list").onclick=function(){view="list";render();};
document.getElementById("m-view-board").onclick=function(){view="board";render();};
document.getElementById("m-search").oninput=function(e){search=e.target.value.toLowerCase();render();};
document.getElementById("m-onboard-btn").onclick=function(){sendPrompt("Show me the onboarding flow prototype again");};
render();
})();
</script>
