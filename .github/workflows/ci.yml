name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is not in GitHub's default set. Without it, a PR opened
    # as a draft gets its CI while still a draft, auto-merge sees the draft and
    # skips it, and nothing ever looks again once it is marked ready. Re-running
    # CI on the transition is what puts the PR back in front of auto-merge,
    # with "CI is green" still a fact rather than a status lookup.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run build
        # tauri::generate_context!() requires the frontendDist ("../dist") to
        # exist at compile time, so it must be built before `cargo test`.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: src-tauri
